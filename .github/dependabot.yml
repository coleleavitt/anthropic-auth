version: 2
enable-beta-ecosystems: true
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # @opentui/solid pins an exact @opentui/core version. Bumping one
      # without the other installs a second, nested core whose types don't
      # match, so both move in one pull request.
      #
      # The OpenCode 2 SDK (@opencode/plugin and the @opencode/* packages it
      # pins exactly) is in the same group: since 2.2.0, @opencode/plugin
      # peers on one exact OpenTUI version, so a plugin SDK bump that needs a
      # newer OpenTUI must move OpenTUI in the same pull request.
      opentui-opencode:
        patterns:
          - "@opentui/*"
          - "@opencode/*"
      # @opencode-ai/plugin pins an exact @opencode-ai/sdk version. Bumping
      # one without the other installs a second, nested SDK whose client types
      # don't match, so the family moves in one pull request.
      opencode-ai:
        patterns:
          - "@opencode-ai/*"
      # The Pi SDK packages release in lockstep and depend on each other
      # (pi-agent-core can pin an exact pi-ai). Bumping one alone installs a
      # second, nested pi-ai whose types don't match, so the family moves in
      # one pull request.
      earendil-works:
        patterns:
          - "@earendil-works/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
